<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            /* Keep the server-rendered fallback readable without JS, but never flash it before React. */
            #app-boot-screen { display:none; }
            .app-initializing #root { visibility:hidden; }
            .app-initializing #app-boot-screen { display:grid; position:fixed; inset:0; z-index:100; place-items:center; margin:0; color:var(--loading-ink,#262626); background:var(--loading-paper,#fafafa); }
            .app-boot-brand #app-boot-screen { --loading-ink:#f4f4f4; --loading-paper:#080808; }
            #app-boot-screen .app-loading__content { text-align:center; }

            html,
            body {
                margin: 0;
                background: #ffffff;
            }
        </style>
        <script>
            document.documentElement.classList.add("app-initializing");
            if (/^\/(?:login|register|forgot-password|i(?:\/.*)?)?\/?$/.test(location.pathname)) document.documentElement.classList.add("app-boot-brand");
        </script>
        <!--# block name="brand_default_head" -->
        <meta name="description" content="梦层 MengCeng，面向独立创作者与小型团队的 AI 影像创作工作台。" />
        <title>梦层 MengCeng</title>
        <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
        <!--# endblock -->
        <!--# include virtual="/_brand-seo/head" stub="brand_default_head" -->
        <link rel="stylesheet" href="/loading-v1.css" />
        <link rel="preload" href="/brand/fonts/glow-sc-medium-core.woff2" as="font" type="font/woff2" crossorigin />
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased" style="background:#ffffff">
        <div id="app-boot-screen" class="app-loading app-loading--screen" role="status" aria-label="正在准备画面"><div class="app-loading__content"><span class="app-loading__frames" aria-hidden="true"><i></i><i></i><i></i></span><div class="app-loading__copy"><span class="app-loading__label">正在准备画面</span></div><span class="app-loading__track" aria-hidden="true"></span></div></div>
        <div id="root">
            <!--# block name="brand_empty_body" --><!--# endblock -->
            <!--# if expr="$canvas_seo_home = 1" -->
            <!--# include virtual="/_brand-seo/body" stub="brand_empty_body" -->
            <!--# else -->
            <div class="app-loading app-loading--screen app-loading--boot" role="status" aria-label="正在准备画面"><div class="app-loading__content"><span class="app-loading__frames" aria-hidden="true"><i></i><i></i><i></i></span><div class="app-loading__copy"><span class="app-loading__label">正在准备画面</span></div><span class="app-loading__track" aria-hidden="true"></span></div></div>
            <!--# endif -->
        </div>
        <script>if (/^\/(?:login|register|forgot-password|i(?:\/.*)?)?\/?$/.test(location.pathname)) document.querySelector('.app-loading')?.classList.add('app-loading--brand');</script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
