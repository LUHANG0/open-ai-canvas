<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="影策，让一个故事从文字走向银幕。面向 AI 影视与短剧创作的开源工作台。" />
        <link rel="icon" href="/logo.svg" />
        <title>影策</title>
        <link rel="stylesheet" href="/src/styles/brand-loading.css" />
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                var p = location.pathname.toLowerCase().replace(/\/$/, "") || "/";
                if (["/", "/product", "/showcase", "/about", "/login", "/register"].includes(p)) t = "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {
                document.documentElement.classList.add("dark");
                document.documentElement.style.colorScheme = "dark";
            }
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root">
            <div data-app-boot-loader class="brand-loader-screen" role="status" aria-live="polite" aria-label="正在打开创作空间">
                <div class="brand-loader is-branded">
                    <span class="brand-loading-indicator is-lg" aria-hidden="true">
                        <svg class="brand-loading-frame" viewBox="0 0 40 40" fill="none">
                            <path d="M5 14V5H14" />
                            <path d="M26 5H35V14" />
                            <path d="M35 26V35H26" />
                            <path d="M14 35H5V26" />
                        </svg>
                        <span class="brand-loading-core"></span>
                    </span>
                    <div class="brand-loader-copy"><span class="brand-loader-label">正在打开创作空间</span><span class="brand-loader-detail">准备当前页面</span></div>
                    <span class="brand-loader-frames" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                    <button class="brand-loader-retry" type="button" hidden>重新加载</button>
                </div>
            </div>
        </div>
        <noscript
            ><style>
                [data-app-boot-loader] {
                    display: none;
                }</style
            >请启用 JavaScript 后重新加载，以打开创作空间。</noscript
        >
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
