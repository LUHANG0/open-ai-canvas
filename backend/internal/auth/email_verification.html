<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>{{.Brand}}账户验证</title></head>
<body style="margin:0;padding:0;background:#f4f5f4;color:#202421;font-family:Geist,'PingFang SC','Microsoft YaHei',sans-serif;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{.Brand}}验证码 {{.Code}}，{{.Minutes}} 分钟内有效，请勿向任何人透露。</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f4;"><tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
<tr><td style="padding:0 0 24px;font-size:24px;line-height:32px;font-weight:600;">{{.Brand}}<span style="font-size:14px;line-height:20px;font-weight:400;color:#626b65;">&nbsp;&nbsp;账户安全</span></td></tr>
<tr><td style="background:#ffffff;border-radius:16px;padding:32px 24px;">
<h1 style="margin:0 0 16px;font-size:24px;line-height:32px;font-weight:600;">{{.Title}}</h1>
<p style="margin:0 0 24px;font-size:16px;line-height:24px;white-space:pre-line;">{{.Intro}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="background:#eef3ef;border-radius:8px;padding:24px 16px;">
<p style="margin:0 0 8px;font-size:14px;line-height:20px;color:#43574b;">本次验证码</p>
<div style="font-size:36px;line-height:40px;font-weight:600;letter-spacing:8px;color:#163c2b;">{{.Code}}</div>
<p style="margin:12px 0 0;font-size:14px;line-height:20px;color:#43574b;">{{.Minutes}} 分钟内有效</p>
</td></tr></table>
<p style="margin:24px 0 0;font-size:14px;line-height:24px;color:#626b65;">仅用于本次操作。请勿向任何人透露验证码，平台工作人员也不会向你索取。</p>
</td></tr>
<tr><td style="padding:24px 8px 0;font-size:12px;line-height:20px;color:#626b65;white-space:pre-line;">{{.Footer}}</td></tr>
</table>
</td></tr></table>
</body></html>
